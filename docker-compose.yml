# docker-compose.yml
# Rôle : orchestre les 2 services de la plateforme — l'API Sénégal
# Connect et sa base PostgreSQL — avec initialisation automatique du
# schéma et attente réelle de disponibilité de la base avant de
# démarrer l'API (pas seulement l'ordre de lancement des containers).

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: senegal-connect-api
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "3001:3001" # Mappage du port PeerJS / WebRTC
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      NODE_ENV: production
      PORT: 3000
      PEER_PORT: 3001
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - senegal-connect-reseau

  postgres:
    image: postgres:14-alpine
    container_name: senegal-connect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - senegal-connect-reseau

networks:
  senegal-connect-reseau:
    driver: bridge

volumes:
  pgdata: