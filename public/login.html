<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Connexion — Sénégal Connect</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body class="fond-auth">
  <div class="carte-auth">
    <h1>Sénégal Connect</h1>
    <p class="sous-titre">Connexion à votre espace support</p>

    <form id="formulaire-connexion">
      <label>Email
        <input id="champ-email" type="email" required autocomplete="username" />
      </label>
      <label>Mot de passe
        <input id="champ-mot-de-passe" type="password" required autocomplete="current-password" />
      </label>
      <button type="submit" id="bouton-connexion">Se connecter</button>
    </form>

    <p id="message-erreur" class="message-erreur" hidden></p>
    <p class="lien-secondaire">Pas encore de compte ? <a href="register.html">Créer un compte</a></p>
  </div>

  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
