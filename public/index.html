<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sénégal Connect — Support client</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app">
    <header class="barre-haut">
      <h1>Sénégal Connect</h1>
      <div class="barre-haut-droite">
        <span id="info-utilisateur"></span>
        <span id="etat-socket" class="pastille-etat" title="État Socket.IO"></span>
        <button id="bouton-deconnexion" class="secondaire">Déconnexion</button>
      </div>
    </header>

    <div class="corps">
      <aside class="panneau-lateral">
        <nav class="onglets-nav">
          <button class="onglet-nav onglet-actif" data-onglet="tickets">Tickets</button>
          <button class="onglet-nav" id="onglet-bouton-clients" data-onglet="clients" hidden>Clients</button>
          <button class="onglet-nav" data-onglet="forfaits">Forfaits</button>
        </nav>

        <div id="vue-tickets" class="vue-onglet">
          <div id="form-nouveau-ticket" hidden>
            <input id="champ-sujet-ticket" placeholder="Décrivez votre problème..." />
            <button id="bouton-ouvrir-ticket">Ouvrir un ticket</button>
          </div>
          <ul id="liste-tickets" class="liste-simple"></ul>
        </div>

        <div id="vue-clients" class="vue-onglet" hidden>
          <ul id="liste-clients" class="liste-simple"></ul>
        </div>

        <div id="vue-forfaits" class="vue-onglet" hidden>
          <ul id="liste-forfaits" class="liste-simple"></ul>
        </div>
      </aside>

      <main class="panneau-principal">
        <div id="zone-sans-ticket" class="zone-vide">
          <p>Sélectionnez un ticket dans la liste, ou ouvrez-en un nouveau.</p>
        </div>

        <div id="zone-ticket" hidden>
          <header class="entete-ticket">
            <div>
              <h2 id="titre-ticket-actif"></h2>
              <span id="statut-ticket-actif" class="badge-statut"></span>
            </div>
            <div class="actions-ticket">
              <button id="bouton-prendre-en-charge" class="secondaire" hidden>Prendre en charge</button>
              <button id="bouton-fermer-ticket" class="danger" hidden>Fermer le ticket</button>
              <button id="bouton-appel-audio" class="secondaire">📞 Audio</button>
              <button id="bouton-appel-video" class="secondaire">🎥 Vidéo</button>
            </div>
          </header>

          <div id="panneau-appel" hidden>
            <div class="conteneur-videos">
              <video id="video-distante" autoplay playsinline></video>
              <video id="video-locale" autoplay playsinline muted></video>
            </div>
            <div class="controles-appel">
              <button id="bouton-raccrocher" class="danger">☎️ Raccrocher</button>
              <button id="bouton-micro" class="secondaire">🎤 Couper micro</button>
              <button id="bouton-camera" class="secondaire">📷 Couper caméra</button>
              <button id="bouton-partage-ecran" class="secondaire">🖥️ Partager l'écran</button>
            </div>
            <p id="statut-appel" class="message-statut"></p>
          </div>

          <div id="zone-messages">
            <div id="liste-messages"></div>
            <p id="indicateur-frappe" class="indicateur-frappe"></p>
          </div>

          <div class="zone-saisie">
            <div id="selecteur-emoji" class="selecteur-emoji" hidden></div>
            <button id="bouton-emoji" class="secondaire" type="button">😊</button>
            <button id="bouton-joindre-fichier" class="secondaire" type="button">📎</button>
            <input id="champ-fichier" type="file" hidden accept="image/jpeg,image/png,application/pdf,audio/mpeg,audio/wav,audio/ogg" />
            <input id="champ-message" placeholder="Écrire un message..." autocomplete="off" />
            <button id="bouton-envoyer-message">Envoyer</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="notifications-toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="vendor/peerjs.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
